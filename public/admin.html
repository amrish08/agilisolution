<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agile Solution | Admin</title><link rel="stylesheet" href="/styles.css"><style>body{padding:24px}.admin{max-width:1100px;margin:30px auto;background:white;padding:25px;border-radius:14px;overflow:auto}input{padding:12px;border:1px solid #ccd3e0;border-radius:8px;margin:8px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:10px;border-bottom:1px solid #e6eaf0;text-align:left;white-space:nowrap}.muted{color:#77839a}</style></head><body><div class="admin"><h1>Agile Solution – Bookings</h1><p class="muted">Private admin view. Keep your admin password confidential.</p><input id="password" type="password" placeholder="Admin password"><button class="primary-btn" id="load">Load bookings</button><p id="msg"></p><div id="table"></div></div><script>
document.getElementById('load').onclick=async()=>{let p=document.getElementById('password').value,msg=document.getElementById('msg'),out=document.getElementById('table');msg.textContent='Loading…';try{let r=await fetch('/api/admin/bookings',{headers:{Authorization:'Bearer '+p}});if(!r.ok)throw Error(r.status===401?'Incorrect password':'Could not load bookings');let rows=await r.json();if(!rows.length){out.textContent='No bookings yet.';msg.textContent='';return}let cols=['id','service','name','phone','address','preferred_date','preferred_time','amount_paise','status','created_at'];let table=document.createElement('table'),head=document.createElement('tr');cols.forEach(c=>{let th=document.createElement('th');th.textContent=c;head.append(th)});let thead=document.createElement('thead');thead.append(head);table.append(thead);let body=document.createElement('tbody');rows.forEach(row=>{let tr=document.createElement('tr');cols.forEach(c=>{let td=document.createElement('td');td.textContent=c==='amount_paise'?'₹'+(row[c]/100).toFixed(2):(row[c]??'');tr.append(td)});body.append(tr)});table.append(body);out.replaceChildren(table);msg.textContent=rows.length+' booking(s)';}catch(e){msg.textContent=e.message;out.textContent='';}};
</script></body></html>
